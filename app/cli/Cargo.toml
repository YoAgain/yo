[package]
name = "yo-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "yo: a Yo account on the command line, JSON out; the bots (skills/) drive it."

[[bin]]
name = "yo"
path = "src/main.rs"

[dependencies]
yo-core = { path = "../../core/client" }
yo-wire = { path = "../../core/wire" }
reqwest = { workspace = true, features = ["blocking"] }
getrandom = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
yo-core = { path = "../../core/client", features = ["test-support"] }
yo-tests = { path = "../../tests" }
yo-hub = { path = "../../hub" }
