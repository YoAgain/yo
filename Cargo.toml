[workspace]
resolver = "2"
members = ["core/wire", "core/client", "core/bindings", "hub", "tests", "app/yogpt"]
# Fuzz targets build with nightly and cargo-fuzz: dev/fuzz.
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
# Dependencies are pinned exactly: an upgrade is a deliberate change of this file.
tls_codec = { version = "=0.5.0", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
chacha20poly1305 = "=0.10.1"
zeroize = "=1.9.1"
getrandom = { version = "=0.2.17", features = ["std"] }
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
axum = "=0.8.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "json"] }
jsonwebtoken = "=9.3.1"
uniffi = "=0.32.2"
proptest = "=1.12.0"
# Privacy Pass tokens (spec 6.10): VOPRF(P-384, SHA-384), RFC 9497.
voprf = { version = "=0.5.0", default-features = false, features = ["alloc"] }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic", "hash2curve", "voprf"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
# libsignal (AGPL-3.0) for the sessions: PQXDH, the Double Ratchet with SPQR. Its tag here, its commit in Cargo.lock (--locked).
# Only the client core links it, never the hub.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.108.0" }
async-trait = "=0.1.92"
rand = "=0.9.5"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests: the dependencies optimised (libsignal, the ciphers), the workspace's own crates not.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
