# Builds the signed Android App Bundle and uploads it to Google Play, as testflight.yml does for the iPhone. Every
# push to main goes to internal testing; a published GitHub release (pre-release included) also goes to closed
# testing (track alpha). The upload key (Play App Signing holds the app signing key) and the Play service account are
# secrets of the environment `play` (main and tags v*); never run this on pull requests.
name: Google Play

on:
  push:
    branches: [main]
    paths:
      - app/android/**
      - core/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/play.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Host dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install pinned Android toolchain
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          export PATH="$HOME/.cargo/bin:$PATH"
          nice -n 10 app/android/dev/bootstrap.sh
      # The Rust core (libyo.so for arm64-v8a and x86_64, the host libyo.so for the unit tests, the UniFFI Kotlin) is
      # built once per run, before Gradle, and only when it changed: its outputs are kept under a hash of everything
      # they are made from, the cargo registry and target dir in case they have to be rebuilt. Gradle then skips
      # buildCore (-PyoCorePrebuilt); without that property, as F-Droid builds, Gradle builds the core itself.
      - id: core
        uses: actions/cache/restore@v6
        with:
          path: |
            app/android/app/build/rustJniLibs
            app/android/app/build/generated/yo
            target/android/debug/libyo.so
          key: core-android-${{ hashFiles('core/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'app/android/dev/core.sh', 'app/android/dev/uniffi.toml', 'app/android/dev/fix-bindings.py') }}
      - id: cargo
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: cargo-android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('core/**') }}
          restore-keys: cargo-android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Rust core
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export JAVA_HOME="$HOME/Android/jdk" ANDROID_HOME="$HOME/Android/sdk" ANDROID_SDK_ROOT="$HOME/Android/sdk"
          nice -n 10 app/android/dev/core.sh
      - if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            app/android/app/build/rustJniLibs
            app/android/app/build/generated/yo
            target/android/debug/libyo.so
          key: ${{ steps.core.outputs.cache-primary-key }}
      - if: steps.core.outputs.cache-hit != 'true' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      - name: Credentials
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          # Firebase (project Yo Push) for FCM: without it the store app gets no push token, so never ship one without.
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "::error::secret GOOGLE_SERVICES_JSON is missing"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
          d=$RUNNER_TEMP/play
          mkdir -p "$d"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$d/upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$d/service-account.json"
          python3 -m venv "$d/venv"
          "$d/venv/bin/pip" install -q google-auth requests

      # The release tag is the version: v1.0.0-RC makes versionName 1.0.0-RC; builds of main keep build.gradle.kts's.
      # The version code only rises: minutes since 1970 (29 million in 2026; Play takes up to 2100000000).
      - name: Build and sign
        env:
          TAG: ${{ github.event.release.tag_name }}
          YO_UPLOAD_STOREPASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          YO_UPLOAD_KEYALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          YO_UPLOAD_KEYPASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          version=()
          if [ "${{ github.event_name }}" = release ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::release tag '$TAG' is not v<x.y.z> or v<x.y.z>-<suffix> (v1.0.0, v1.0.0-RC)"; exit 1; }
            version=("-PyoVersionName=${TAG#v}")
          fi
          export YO_UPLOAD_STOREFILE=$RUNNER_TEMP/play/upload.jks
          export PATH="$HOME/.cargo/bin:$PATH"
          export JAVA_HOME="$HOME/Android/jdk" ANDROID_HOME="$HOME/Android/sdk" ANDROID_SDK_ROOT="$HOME/Android/sdk"
          . app/android/dev/env.sh
          export YO_BUILD=$(date -u +%Y%m%d%H%M)  # the Yo-App build: the UTC minute, as iOS and the CLI
          cd app/android
          nice -n 10 ./gradlew --max-workers=4 :app:bundlePlayRelease -PyoCorePrebuilt "-PyoVersionCode=$(( $(date +%s) / 60 ))" "${version[@]}"
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          # Unsigned or signed with anything but the upload key: Play would refuse it, fail here.
          "$JAVA_HOME/bin/jarsigner" -verify "$aab" | grep -q "jar verified" || { echo "::error::$aab is not signed"; exit 1; }

      # Closed testing (alpha) gets only released builds, as TestFlight's outside testers; one upload for both tracks.
      - name: Upload
        run: |
          tracks=internal
          [ "${{ github.event_name }}" = release ] && tracks=internal,alpha
          "$RUNNER_TEMP/play/venv/bin/python" -I app/android/dev/play.py "$RUNNER_TEMP/play/service-account.json" \
            app/android/app/build/outputs/bundle/playRelease/app-play-release.aab "$tracks"
