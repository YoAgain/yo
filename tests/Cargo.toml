[package]
name = "yo-tests"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Scenario, chaos and load tests: a real hub and real clients over HTTP."
# One test binary for the end-to-end tests (each file a module of tests/e2e.rs): one link instead of one per file.
# speed.rs alone, so its timings never share the process with the rest.
autotests = false

[[bin]]
name = "yo-load"
path = "src/load.rs"

[[bin]]
name = "yo-register"
path = "src/register.rs"

[[bin]]
name = "yo-send"
path = "src/send.rs"

[[bin]]
name = "yo-yops"
path = "src/yops.rs"

[[bin]]
name = "yo-chaos"
path = "src/chaos.rs"

[[bin]]
name = "yo-scale"
path = "src/scale.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "speed"
path = "tests/speed.rs"

[dependencies]
yoip = { path = "../yoip" }
yo-core = { path = "../app/core", features = ["test-support"] }
yo-ui = { path = "../app/core/ui" }
yo-hub = { path = "../server/hub" }
yo-bindings = { path = "../app/core/bindings", features = ["test-support"] }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
libsignal-protocol = { workspace = true }
zkgroup = { workspace = true }
rand = { workspace = true }
libc = "=0.2.191"
rusqlite = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tower = { version = "=0.5.3", features = ["util"] }
