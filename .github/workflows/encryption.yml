# Reads Yo's app encryption documentation from App Store Connect: its state and the code the Info.plist must carry
# as ITSEncryptionExportComplianceCode when ITSAppUsesNonExemptEncryption is true (upload error 90592 otherwise).
# Run by hand; prints only the declaration's fields, never the key.
name: Encryption documentation
on: workflow_dispatch
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read the declarations
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install --quiet pyjwt==2.10.1 cryptography==44.0.2
          python3 - <<'EOF'
          import json, os, re, textwrap, time, urllib.request, jwt
          raw = os.environ["ASC_KEY_P8"].replace("\\n", "\n").strip()
          if "BEGIN" not in raw:
              body = re.sub(r"\s+", "", raw)
              raw = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----"
          else:
              head, body, tail = re.match(r"(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)", raw, re.S).groups()
              raw = head + "\n" + "\n".join(textwrap.wrap(re.sub(r"\s+", "", body), 64)) + "\n" + tail
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600,
               "aud": "appstoreconnect-v1"},
              raw + "\n", algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          url = "https://api.appstoreconnect.apple.com/v1/apps/6834493649/appEncryptionDeclarations?limit=50"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          data = json.load(urllib.request.urlopen(req))["data"]
          print(f"{len(data)} declaration(s)")
          keep = ("appEncryptionDeclarationState", "codeValue", "exempt", "containsProprietaryCryptography",
                  "containsThirdPartyCryptography", "availableOnFrenchStore", "platform", "uploadedDate",
                  "usesEncryption", "isExempt")
          for d in data:
              a = d["attributes"]
              print(json.dumps({k: a.get(k) for k in keep if k in a}))
          EOF
