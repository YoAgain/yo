[package]
name = "yo-services"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "yo-services: the gatekeeper that runs one service (a bot) of the yo-services repository."

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
yo-core = { path = "../core/client", features = ["test-support"] }
yo-tests = { path = "../tests" }
yo-wire = { path = "../core/wire" }
