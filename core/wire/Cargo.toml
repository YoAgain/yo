[package]
name = "yo-wire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The contract between the apps and the hub (spec/v1.md): formats, limits, error codes, the device certificate and the signed request. Verifies, never signs: no secret key, no I/O."

[dependencies]
serde = { workspace = true }
tls_codec = { workspace = true }
sha2 = { workspace = true }
libsignal-core = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"
unicode-properties = "=0.1.5"
# The RGI emoji (UTS #51, Unicode 18) a username may have: whole sequences only (spec 3.3).
emojis = "=0.9.1"

[dev-dependencies]
proptest = { workspace = true }
getrandom = { workspace = true }
rand = { workspace = true }
