[package]
name = "yo-bindings"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The core for Swift and Kotlin, through UniFFI."

[lib]
name = "yo"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "bindgen.rs"

[features]
# Test hooks: the core client under the binding (its clock, its counters).
test-support = ["yo-core/test-support"]

[dependencies]
yo-product = { path = "../product" }
yo-core = { path = "../client" }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }
