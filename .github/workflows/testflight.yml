# Builds the iPhone app on macOS and uploads it to TestFlight with omarchy-apple-dev's ship.sh, the same path as
# on Linux. Every push to main goes to the internal testers; a published GitHub release (pre-release included) also
# goes to the outside testers. The App Store Connect key and the distribution identity are secrets of the
# environment `testflight` (main and tags v*); never run this on pull requests.
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - app/ios/**
      - core/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/testflight.yml
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: testflight

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 95
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OAD_COMMIT: 9af7bca43931552fe94db32f353a5f4e77866cc5
      XTOOL_VERSION: 1.24.0
      APPLE_CODESIGN_VERSION: 0.29.0   # not RCODESIGN_*: rcodesign reads those as its settings
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: joshuaswarren/omarchy-apple-dev
          ref: ${{ env.OAD_COMMIT }}
          path: .oad

      # OAD's App Intents metadata knows one system protocol (WidgetConfiguration) and leaves LiveActivityIntent out,
      # which Xcode writes as com.apple.link.systemProtocol.SessionStarting. Without it the system runs Send Yo and Yo
      # Back from a control in YoControls, where no Live Activity may start ("Sent Yo! to Mia" never showed;
      # liveactivitiesd: "Target does not include NSSupportsLiveActivities"), and the list never heard of the Yo. With
      # it they run in the app's process. Patched into this checkout only; fails if the tool changed.
      - name: OAD, LiveActivityIntent metadata
        run: |
          python3 -I - .oad/tools/appintentsmeta.py <<'EOF'
          import sys
          path = sys.argv[1]
          s = open(path).read()
          old = [
              "        'systemProtocolMetadata': [WIDGET_PROTOCOL, {'empty': {}}] if widget else [],\n",
              "        'systemProtocolMetadataV2': [WIDGET_PROTOCOL, {'empty': {}}] if widget else [],\n",
              "        'systemProtocols': [WIDGET_PROTOCOL] if widget else [],\n",
          ]
          new = [
              "        'systemProtocolMetadata': [x for p in protocols for x in (p, {'empty': {}})],\n",
              "        'systemProtocolMetadataV2': [x for p in protocols for x in (p, {'empty': {}})],\n",
              "        'systemProtocols': protocols,\n",
          ]
          anchor = "    widget = module.conforms(entry, 'AppIntents.WidgetConfigurationIntent')\n"
          assert s.count(anchor) == 1 and all(s.count(o) == 1 for o in old), "appintentsmeta.py changed: patch again"
          s = s.replace(anchor, anchor + "    protocols = ([WIDGET_PROTOCOL] if widget else []) + (\n"
              "        ['com.apple.link.systemProtocol.SessionStarting']\n"
              "        if module.conforms(entry, 'AppIntents.LiveActivityIntent') else [])\n")
          for o, n in zip(old, new):
              s = s.replace(o, n)
          open(path, "w").write(s)
          EOF

      # OAD trains App Shortcuts for CFBundleDevelopmentRegion only (Metadata.appintents/nlu, "trained for en"), so
      # Siri in German answered "Die App „Yo“ unterstützt diesen Vorgang mit Siri nicht". Xcode's
      # appintentsnltrainingprocessor (in this runner's Xcode) trains every localization: the development region in
      # Metadata.appintents/nlu, each <lang>.lproj with an AppShortcuts.strings in <lang>.lproj/nlu.appintents. With
      # XCODE_NLTRAINING set, the tool's training step runs Xcode's, with the arguments of Xcode's release build
      # (AppIntentsNLTraining.xcspec), on OAD's extract.actionsdata; it fails if a localization stays untrained.
      # Patched into this checkout only; fails if the tool changed.
      - name: OAD, App Shortcuts trained for every localization
        run: |
          python3 -I - .oad/tools/appintentsmeta.py <<'EOF'
          import sys
          path = sys.argv[1]
          s = open(path).read()
          anchor = ('def write_training(data, args, root):\n'
                    '    """appintentsnltrainingprocessor --archive-ssu-assets: root.ssu.yaml and nlu/."""\n')
          assert s.count(anchor) == 1 and "args.output" in s and "args.bundle_identifier" in s, \
              "appintentsmeta.py changed: patch again"
          xcode = '''def xcode_training(data, args, root):
              """Xcode's own appintentsnltrainingprocessor, as its release build runs it: every localization."""
              import glob, shutil, subprocess, tempfile
              bundle = args.output
              info = args.info_plist or os.path.join(bundle, 'Info.plist')
              # Xcode's release products hold no root.ssu.yaml; nothing of OAD's own training stays.
              if os.path.isdir(os.path.join(root, 'nlu')):
                  shutil.rmtree(os.path.join(root, 'nlu'))
              if os.path.exists(os.path.join(root, 'root.ssu.yaml')):
                  os.remove(os.path.join(root, 'root.ssu.yaml'))
              strings = sorted(glob.glob(os.path.join(bundle, '*.lproj', 'AppShortcuts.strings')))
              with tempfile.TemporaryDirectory() as tmp:
                  cmd = ['xcrun', 'appintentsnltrainingprocessor', '--infoplist-path', info, '--temp-dir-path', tmp,
                         '--bundle-id', args.bundle_identifier, '--product-path', bundle,
                         '--extracted-metadata-path', root, '--deployment-postprocessing']
                  for f in [info] + strings:
                      cmd += ['--source-file', f]
                  subprocess.run(cmd + ['--archive-ssu-assets'], check=True)
              trained = sorted(glob.glob(os.path.join(bundle, '*.lproj', 'nlu.appintents', 'nlu.lzfse')))
              if os.path.isfile(os.path.join(root, 'nlu', 'nlu.lzfse')):
                  trained.append(os.path.join(root, 'nlu', 'nlu.lzfse'))
              missing = [s for s in strings
                         if not os.path.isfile(os.path.join(os.path.dirname(s), 'nlu.appintents', 'nlu.lzfse'))]
              if not trained or missing:
                  raise MetadataError(f'Xcode trained {trained or "nothing"}; untrained: {missing}')
              print(f'{bundle}: App Shortcuts trained by Xcode: ' + ', '.join(os.path.relpath(t, bundle) for t in trained))


          '''
          hook = "    if os.environ.get('XCODE_NLTRAINING') and data['autoShortcuts']:\n        return xcode_training(data, args, root)\n"
          s = s.replace(anchor, xcode + anchor + hook)
          open(path, "w").write(s)
          EOF
          python3 -I -m py_compile .oad/tools/appintentsmeta.py

      # OAD's offline App Store check reads a signature's sealed Info.plist and CodeResources as SHA-256 only. Apple's
      # MessagesApplicationExtensionStub (the sticker pack's executable, dev/stickers.sh) says iOS 10, so it is sealed
      # SHA-1 first with SHA-256 beside, as Xcode's codesign does too, and the check failed ("appex YoStickers.appex:
      # Info.plist matches its sealed hash"). The digest goes by the slot's length. Patched into this checkout only;
      # fails if the tool changed.
      - name: OAD, SHA-1 sealed stub in the App Store check
        run: |
          python3 -I - .oad/tools/asc.py <<'EOF'
          import sys
          path = sys.argv[1]
          s = open(path).read()
          pairs = [
              ('r"(Info|Resources) \\(\\d\\): ([0-9a-f]{64})"', 'r"(Info|Resources) \\(\\d\\): ([0-9a-f]{64}|[0-9a-f]{40})"', 2),
              ('check(slots.get("Info") == hashlib.sha256(', 'check(slots.get("Info") == _seal(slots.get("Info"), ', 1),
              ('and slots.get("Resources") == hashlib.sha256(', 'and slots.get("Resources") == _seal(slots.get("Resources"), ', 1),
              ('aslots.get("Info") == hashlib.sha256(', 'aslots.get("Info") == _seal(aslots.get("Info"), ', 1),
              ('aslots.get("Resources") == hashlib.sha256(', 'aslots.get("Resources") == _seal(aslots.get("Resources"), ', 1),
          ]
          anchor = "def _check_signature_seals("
          assert s.count(anchor) == 1 and all(s.count(o) == n for o, _, n in pairs), "asc.py changed: patch again"
          for o, n, _ in pairs:
              s = s.replace(o, n)
          s = s.replace(anchor, "def _seal(slot, data):\n"
              "    return hashlib.new('sha1' if len(slot or '') == 40 else 'sha256', data)\n\n\n" + anchor)
          open(path, "w").write(s)
          EOF
          python3 -I -m py_compile .oad/tools/asc.py

      # OAD signs only the capabilities it knows (push, Sign in with Apple, Associated Domains, App Group); the app also
      # asks for Communication Notifications (a Yo shown as a message from its sender, Siri announce, CarPlay) and Siri
      # (SiriKit messaging: send, read, mark read). Each is signed on the app as its profile grants it (enabled on the
      # app id), and a request the profile does not grant fails, as push does. Patched into this checkout only; fails if
      # the tool changed.
      - name: OAD, Communication Notifications and Siri entitlements
        run: |
          python3 -I - .oad/tools/asc.py <<'EOF'
          import sys
          path = sys.argv[1]
          s = open(path).read()
          anchor = "            entitlements.update(capability_entitlements(requested_caps, granted, ident))\n"
          assert s.count(anchor) == 1, "asc.py changed: patch again"
          s = s.replace(anchor, anchor +
              "        if path == Path(app_dir) and os.environ.get('ASC_ENTITLEMENTS_PATH'):\n"
              "            with Path(os.environ['ASC_ENTITLEMENTS_PATH']).open('rb') as f:\n"
              "                own = plistlib.load(f)\n"
              "            for key in ('com.apple.developer.usernotifications.communication', 'com.apple.developer.siri'):\n"
              "                if own.get(key) is True:\n"
              "                    if granted.get(key) is not True:\n"
              "                        die(f'profile for {ident} does not grant {key}; enable it for the bundle ID and recreate its profile')\n"
              "                    entitlements[key] = True\n")
          open(path, "w").write(s)
          EOF
          python3 -I -m py_compile .oad/tools/asc.py

      # Downloaded tools, kept between runs (the versions above are the key).
      - id: tools
        uses: actions/cache@v6
        with:
          path: ~/ci-tools
          key: tools-xtool-${{ env.XTOOL_VERSION }}-rcodesign-${{ env.APPLE_CODESIGN_VERSION }}
      - name: Download tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ci-tools/bin
          curl -fsSL "https://github.com/xtool-org/xtool/releases/download/$XTOOL_VERSION/xtool.app.zip" -o "$RUNNER_TEMP/xtool.zip"
          unzip -q "$RUNNER_TEMP/xtool.zip" -d ~/ci-tools
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/apple-codesign-$APPLE_CODESIGN_VERSION-macos-universal.tar.gz" \
            | tar -xz -C ~/ci-tools/bin --strip-components 1
      - name: Tools
        run: |
          xcodebuild -version
          brew install -q bash   # ship.sh wants bash 4 or later
          # xtool's command line; xtool.app/Contents/MacOS/xtool is the app and waits for its window.
          echo ~/ci-tools/xtool.app/Contents/Resources/bin >> "$GITHUB_PATH"
          echo ~/ci-tools/bin >> "$GITHUB_PATH"
          # ship.sh runs its tools with this Python; asc.py needs cryptography.
          python3 -m venv ~/pymobile3-venv
          ~/pymobile3-venv/bin/pip install -q cryptography

      # The Rust core is built only when it changed: the xcframework and bindings are kept under a hash of
      # everything they are made from, the cargo registry and target dir in case they have to be rebuilt.
      - id: core
        uses: actions/cache/restore@v6
        with:
          path: app/ios/YoApp/build/core
          key: core-${{ env.DEVELOPER_DIR }}-${{ hashFiles('core/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'app/ios/dev/core.sh') }}
      - id: cargo
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ios
          key: cargo-ios-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('core/**') }}
          restore-keys: cargo-ios-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Rust core
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          brew list protobuf >/dev/null 2>&1 || brew install protobuf  # libsignal builds its protobufs
          rustup target add aarch64-apple-ios
          app/ios/dev/core.sh
      - if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/ios/YoApp/build/core
          key: ${{ steps.core.outputs.cache-primary-key }}
      - if: steps.core.outputs.cache-hit != 'true' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ios
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # SwiftPM's build directory, for an incremental app build.
      - uses: actions/cache@v6
        with:
          path: app/ios/YoApp/.build
          key: swiftpm-${{ env.DEVELOPER_DIR }}-${{ hashFiles('app/ios/YoApp/**') }}
          restore-keys: swiftpm-${{ env.DEVELOPER_DIR }}-

      - name: Credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_KEY_PEM: ${{ secrets.DIST_KEY_PEM }}
          DIST_CERT_DER_B64: ${{ secrets.DIST_CERT_DER_B64 }}
        run: |
          umask 077
          d=$RUNNER_TEMP/asc
          mkdir -p "$d/distribution"
          printf '%s\n' "$ASC_KEY_P8" > "$d/AuthKey.p8"
          printf '%s\n' "$DIST_KEY_PEM" > "$d/distribution/key.pem"
          printf '%s' "$DIST_CERT_DER_B64" | base64 -d > "$d/distribution/cert.der"
          # The certificate's names (team, holder) show up in the signing output; keep them out of the public log.
          ~/pymobile3-venv/bin/python -I - "$d/distribution/cert.der" <<'EOF'
          import sys
          from cryptography import x509
          from cryptography.x509.oid import NameOID
          cert = x509.load_der_x509_certificate(open(sys.argv[1], "rb").read())
          for attribute in cert.subject:
              if attribute.oid != NameOID.COUNTRY_NAME:
                  print(f"::add-mask::{attribute.value}")
          EOF

      # Settings › Licenses names the commit the build is made from: made for every build, never from the cache.
      - name: Licenses
        run: app/ios/dev/licenses.sh

      # The release tag is the version: v1.0.0-RC makes CFBundleShortVersionString 1.0.0 (App Store versions are
      # numbers only, the suffix stays with the tag; ship.sh copies the app's version into the extensions). Builds of
      # main keep Info.plist's. The build number stays ship.sh's (UTC yyyymmddHHMM).
      - name: Version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::release tag '$TAG' is not v<x.y.z> or v<x.y.z>-<suffix> (v1.0.0, v1.0.0-RC)"; exit 1; }
          plutil -replace CFBundleShortVersionString -string "${BASH_REMATCH[1]}" app/ios/YoApp/Info.plist
          echo "version ${BASH_REMATCH[1]} from $TAG"
          # The suffix (RC19) goes into YoReleaseName, which About shows as "1.0.0 RC19"; builds of main have no key.
          if [ -n "${BASH_REMATCH[2]}" ]; then
            plutil -replace YoReleaseName -string "${BASH_REMATCH[2]#-}" app/ios/YoApp/Info.plist
          fi

      # Communication Notifications and Siri (SiriKit messaging, CarPlay) on the app id, through the API with the same key:
      # once, the first time; the app's App Store profile is then deleted so ship.sh makes it anew with both granted.
      # Fatal when the API refuses: the owner enables them in the developer portal (Identifiers > app.justyo.ios).
      - name: Communication Notifications and Siri on the app id
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8 ~/pymobile3-venv/bin/python -I - .oad/tools <<'EOF'
          import sys
          sys.path.insert(0, sys.argv[1])
          import asc
          identifier = "app.justyo.ios"
          bid = asc.bundle_id(identifier)
          have = {c["attributes"]["capabilityType"]
                  for c in asc.call("GET", f"/v1/bundleIds/{bid}/bundleIdCapabilities")["data"]}
          print(f"{identifier}: {sorted(have)}")
          enabled = False
          for cap in ("USERNOTIFICATIONS_COMMUNICATION", "SIRIKIT"):
              if cap in have:
                  continue
              try:
                  asc.call("POST", "/v1/bundleIdCapabilities", {"data": {
                      "type": "bundleIdCapabilities", "attributes": {"capabilityType": cap},
                      "relationships": {"bundleId": asc.rel("bundleIds", bid)}}})
              except SystemExit:
                  print(f"::error::cannot enable {cap} on {identifier}: enable it in the developer portal")
                  sys.exit(1)
              print(f"enabled {cap} on {identifier}")
              enabled = True
          if enabled:
              for prof in asc.call("GET", f"/v1/bundleIds/{bid}/profiles?limit=200")["data"]:
                  attributes = prof["attributes"]
                  if attributes.get("profileType") == "IOS_APP_STORE" and attributes["name"].startswith(f"omarchy-apple-dev {identifier} "):
                      asc.call("DELETE", f"/v1/profiles/{prof['id']}")
                      print(f"deleted profile {attributes['name']}: made anew with the capabilities")
          EOF

      # Built, signed and validated here; uploaded after the checks below (ship.sh step 9, as a step of its own).
      - name: Build and sign
        working-directory: app/ios/YoApp
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # App Intents metadata (ship.sh step 5): Package.swift asks this SwiftPM for the .swiftconstvalues, which
          # only swift-build writes by itself; App Shortcuts are trained with Xcode's SiriSSUKitModel resources.
          YO_CONST_VALUES: 1
          # App Shortcuts trained by Xcode's own tool for every localization (step "OAD, App Shortcuts trained …").
          XCODE_NLTRAINING: 1
        run: |
          export ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8 ASC_IDENTITY_DIR=$RUNNER_TEMP/asc/distribution
          export SSU_RESOURCES=$(dirname "$DEVELOPER_DIR")/Frameworks/SiriSSUKitModel.framework/Versions/A/Resources
          ls -d "$SSU_RESOURCES"
          # Xcode in place of the Linux SDK and its stand-ins.
          # dev/actool.sh: Xcode's actool, keeping Info.plist's alternate icons through the merge of its partial plist,
          # compiling the controls' Yo symbols (Resources/Symbols.xcassets) into YoControls, and assembling the iMessage
          # sticker pack YoStickers.appex (dev/stickers.sh; ship.sh registers app.justyo.ios.stickers and its profile).
          export REAL_ACTOOL=$(xcrun -f actool) ACTOOL=$PWD/../dev/actool.sh DARWIN_SDK=$(dirname "$DEVELOPER_DIR")
          export XCODE_VERSION=$(xcodebuild -version | sed -n 's/^Xcode //p') XCODE_BUILD=$(xcodebuild -version | sed -n 's/^Build version //p')
          "$GITHUB_WORKSPACE/.oad/ship.sh"

      # The app and its extensions share the account's state through the App Group (SharedState.swift); without it in
      # their profiles (the group not attached to their app ids in the developer portal) the notification service
      # names nobody and every push says only "Yo". Fatal, before the upload: such a build does not go to testers.
      # The sticker pack (YoStickers, dev/stickers.sh) has no code and reads no state: it needs no group.
      - name: App Group
        working-directory: app/ios/YoApp
        run: |
          ~/pymobile3-venv/bin/python -I - xtool/YoApp.app <<'EOF'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          missing = False
          for bundle in [app, *sorted(app.glob("PlugIns/*.appex"))]:
              if bundle.name == "YoStickers.appex":
                  continue
              raw = (bundle / "embedded.mobileprovision").read_bytes()
              profile = plistlib.loads(raw[raw.index(b"<?xml"):raw.rindex(b"</plist>") + 8])
              groups = profile["Entitlements"].get("com.apple.security.application-groups", [])
              print(f"{bundle.name}: {groups}")
              if "group.app.justyo.ios" not in groups:
                  print(f"::error::{bundle.name}: no App Group group.app.justyo.ios in its profile")
                  missing = True
          sys.exit(1 if missing else 0)
          EOF

      # Invite links (justyo.co/NAME, a scanned Yo QR code) open the app only if its signature carries
      # applinks:justyo.co, which the profile grants only with Associated Domains on the app id. Fatal, before the
      # upload, as the App Group.
      - name: Associated Domains
        working-directory: app/ios/YoApp
        run: |
          codesign -d --entitlements :- xtool/YoApp.app > "$RUNNER_TEMP/signed.plist"
          ~/pymobile3-venv/bin/python -I - xtool/YoApp.app "$RUNNER_TEMP/signed.plist" Entitlements.plist <<'EOF'
          import pathlib, plistlib, sys
          app, signed_path, own_path = map(pathlib.Path, sys.argv[1:])
          key = "com.apple.developer.associated-domains"
          raw = (app / "embedded.mobileprovision").read_bytes()
          granted = plistlib.loads(raw[raw.index(b"<?xml"):raw.rindex(b"</plist>") + 8])["Entitlements"].get(key, [])
          signed = plistlib.loads(signed_path.read_bytes()).get(key, [])
          wanted = plistlib.loads(own_path.read_bytes())[key]
          print(f"profile grants: {granted}\nsigned: {signed}\nwanted: {wanted}")
          if not granted:
              print("::error::YoApp.app: its profile grants no Associated Domains (not enabled on the app id)")
              sys.exit(1)
          missing = [d for d in wanted if d not in signed]
          if missing:
              print(f"::error::YoApp.app: signed without {missing}: invite links and passkeys do not reach the app")
              sys.exit(1)
          EOF

      # The sticker pack as Xcode exports it: its executable a universal file (--resign, the app signed again over it)
      # and the same stub beside Payload/ (MessagesApplicationExtensionSupport/): App Store Connect rejects an iMessage
      # app without it (90620) or with the two in different forms (90614). After ship.sh, whose offline check wants
      # every entry under Payload/.
      - name: Sticker pack support
        working-directory: app/ios/YoApp
        run: |
          [ -d xtool/YoApp.app/PlugIns/YoStickers.appex ] || { echo "::error::no YoStickers.appex in the build"; exit 1; }
          ../dev/stickers.sh --resign xtool/YoApp.app xtool/ship-signing xtool/YoApp.ipa
          # The app signed again over the sticker pack's universal executable: ship.sh's offline check once more, with
          # what ship.sh reads from xtool.env (the app's requested entitlements).
          (. ./xtool.env && ~/pymobile3-venv/bin/python "$GITHUB_WORKSPACE/.oad/tools/asc.py" validate "$PWD/xtool/YoApp.ipa")
          ../dev/stickers.sh --support xtool/YoApp.ipa
          unzip -l xtool/YoApp.ipa | grep -q " MessagesApplicationExtensionSupport/MessagesApplicationExtensionStub$"

      - name: Upload
        working-directory: app/ios/YoApp
        timeout-minutes: 20
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8 ~/pymobile3-venv/bin/python "$GITHUB_WORKSPACE/.oad/tools/asc.py" upload "$PWD/xtool/YoApp.ipa"

      # Debug symbols of the app and its extensions, kept with the run: crash reports (MetricKit, TestFlight) name
      # "YoApp +0x1ed29c"; with these (and the UUIDs, to match the build) they can be symbolicated later.
      - name: Debug symbols
        if: always()
        continue-on-error: true
        working-directory: app/ios/YoApp
        run: |
          mkdir -p "$RUNNER_TEMP/dsym"
          for bin in xtool/YoApp.app/YoApp xtool/YoApp.app/PlugIns/*.appex/*; do
            [ -f "$bin" ] && file "$bin" | grep -q Mach-O || continue
            name=$(basename "$bin")
            dsymutil "$bin" -o "$RUNNER_TEMP/dsym/$name.dSYM" || true
            dwarfdump --uuid "$bin" >> "$RUNNER_TEMP/dsym/uuids.txt" || true
          done
          ls -la "$RUNNER_TEMP/dsym"
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: dsym-${{ github.sha }}
          path: ${{ runner.temp }}/dsym
          retention-days: 90

      # The icons to choose from in Appearance: actool's partial Info.plist replaces CFBundleIcons, dev/actool.sh puts
      # Info.plist's alternates (loose PNGs at the root) back into it. Said in the run's summary, not fatal.
      - name: Alternate icons
        working-directory: app/ios/YoApp
        run: |
          ~/pymobile3-venv/bin/python -I - xtool/YoApp.app <<'EOF'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          icons = plistlib.loads((app / "Info.plist").read_bytes()).get("CFBundleIcons", {})
          alternates = icons.get("CFBundleAlternateIcons", {})
          print("primary:", icons.get("CFBundlePrimaryIcon"))
          for name, entry in sorted(alternates.items()):
              files = [p.name for f in entry.get("CFBundleIconFiles", []) for p in app.glob(f + "*.png")]
              print(f"{name}: {entry} {files}")
          if not alternates:
              print("::warning::no CFBundleAlternateIcons in the app's Info.plist: the icon cannot be switched")
          EOF

      # Outside testers (the public link) get only released builds: into the group "Public", submitted to Beta App
      # Review.
      - name: Public beta
        if: github.event_name == 'release'
        timeout-minutes: 35
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8 ~/pymobile3-venv/bin/python -I app/ios/dev/beta.py "$GITHUB_WORKSPACE/.oad/tools"
