[package]
name = "yo-hub"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Yo hub: mailboxes, prekeys, push. Holds no content key, never learns a sender."

[lib]
path = "src/lib.rs"

[[bin]]
name = "yo-hub"
path = "src/main.rs"

[dependencies]
yoip = { path = "../../yoip" }
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
futures-core = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false }
rustix = { version = "=1.1.6", features = ["fs"] }
axum = { workspace = true }
bytes = "=1.12.2"
rusqlite = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
libsignal-protocol = { workspace = true }
zkgroup = { workspace = true }

ohttp = { version = "=0.8.0", default-features = false, features = ["server", "rust-hpke"] }
bhttp = "=0.8.0"
httpdate = "=1.0.3"
# The inner routes served in-process (Oblivious HTTP, spec 4.1).
tower = { version = "=0.5.3", features = ["util"] }
aws-lc-rs = "=1.19.0"
rustls-webpki = { version = "=0.103.17", features = ["aws-lc-rs"] }
rustls-pki-types = "=1.16.0"
x509-parser = "=0.18.1"
ciborium = "=0.2.2"
base64.workspace = true
subtle = "=2.6.1"

[dev-dependencies]
ohttp = { version = "=0.8.0", default-features = false, features = ["client", "server", "rust-hpke"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
