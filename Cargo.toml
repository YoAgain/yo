[workspace]
resolver = "2"
members = ["core/wire", "core/mls", "core/bindings", "hub", "tests"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
# OpenMLS and its providers are pinned exactly: an upgrade is a deliberate change of this file.
openmls = { version = "=0.9.1", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_memory_storage = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "mls"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
chacha20poly1305 = "=0.10.1"
zeroize = "=1.9.1"
getrandom = "=0.2.17"
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
axum = "=0.8.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "json"] }
jsonwebtoken = "=9.3.1"
uniffi = "=0.32.2"
proptest = "=1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests: the dependencies optimised (OpenMLS, the ciphers), the workspace's own crates not.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
