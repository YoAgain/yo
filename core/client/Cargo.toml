[package]
name = "yo-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Yo client core: identities, sessions, delivery. One implementation for iOS and Android."

[features]
# Exposes the receive path to the fuzz targets in fuzz/.
fuzz = []
# Test hooks: a device under an existing account key (as a passkey's backup will make one).
testing = []

[dependencies]
yo-product = { path = "../product" }
yo-wire = { path = "../wire" }
tls_codec = { workspace = true }
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand_core = { workspace = true }
libsignal-protocol = { workspace = true }
libsignal-account-keys = { workspace = true }
zkgroup = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

# The state shared by an app and its extensions (statedb.rs). The iPhone links its own SQLite (libsqlite3 of the
# SDK: Apple's file protection, no C compiler for the core); elsewhere SQLite is built in.
[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = { version = "=0.32.1" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { workspace = true }
