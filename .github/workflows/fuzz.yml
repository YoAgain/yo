name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire_envelope, wire_content, wire_cert, wire_api, hub_routes, core_receive]
    steps:
      - uses: actions/checkout@v7
      - name: protoc (libsignal builds its protobufs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-21 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml', 'fuzz/Cargo.lock') }}
      - name: Fuzz (1 minute on push, 15 nightly)
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp seeds/${{ matrix.target }}/* corpus/${{ matrix.target }}/ 2>/dev/null || true
          seconds=60; [ "${{ github.event_name }}" = schedule ] && seconds=900
          cargo +nightly-2026-11-21 metadata --locked --format-version 1 >/dev/null  # fuzz/Cargo.lock is current
          cargo +nightly-2026-11-21 fuzz run ${{ matrix.target }} -- -max_total_time=$seconds
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
