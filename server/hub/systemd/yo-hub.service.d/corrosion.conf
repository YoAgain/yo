# The live hub on Corrosion (yo #15): the central hub. Its messages there, its read tables mirrored there for the
# edges; the live cluster (yo-corrosion-live), never dev's. YO_PEER_TOKEN is in /etc/yo/hub.env, the same on the edges.
[Unit]
After=yo-corrosion-live.service
Wants=yo-corrosion-live.service
[Service]
Environment=YO_CORROSION_API=http://127.0.0.1:8098 YO_CORROSION_DB=/var/lib/yo-corrosion-live/corrosion.db
Environment=YO_HUB_NAME=falkenstein YO_HUB_INDEX=0
SupplementaryGroups=yo-corro
ReadWritePaths=/var/lib/yo-corrosion-live
# The edges over the mesh (a device's envelopes they hold): the node's own mesh.toml and certificates (mesh.conf);
# its requests name hub.justyo.app, which the edges' nodes hand to their live hub.
Environment=YO_MESH_PEERS=%d/mesh.toml YO_MESH_HOST=hub.justyo.app
