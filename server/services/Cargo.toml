[package]
name = "yo-services"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "yo-services: the gatekeeper that runs one service (a bot) of the yo-services repository."

[dependencies]
ab_glyph = "=0.2.32"
axum = { workspace = true }
base64 = { workspace = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "=0.15.0", default-features = false }
getrandom = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
toml = { workspace = true }

[dev-dependencies]
yo-core = { path = "../../app/core", features = ["test-support"] }
yo-tests = { path = "../../tests" }
yoip = { path = "../../yoip" }
