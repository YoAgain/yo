[package]
name = "yo-tests"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Scenario, chaos and load tests: a real hub and real clients over HTTP."

[[bin]]
name = "yo-load"
path = "src/load.rs"

[[bin]]
name = "yo-register"
path = "src/register.rs"

[[bin]]
name = "yo-send"
path = "src/send.rs"

[[bin]]
name = "yo-yops"
path = "src/yops.rs"

[[bin]]
name = "yo-chaos"
path = "src/chaos.rs"

[[bin]]
name = "yo-scale"
path = "src/scale.rs"

[dependencies]
yo-wire = { path = "../core/wire" }
yo-core = { path = "../core/client", features = ["testing"] }
yo-hub = { path = "../hub" }
yo-bindings = { path = "../core/bindings", features = ["testing"] }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
libsignal-protocol = { workspace = true }
rand = { workspace = true }
libc = "=0.2.191"
rusqlite = { workspace = true }
