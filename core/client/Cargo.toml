[package]
name = "yo-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Yo client core: identities, sessions, delivery. One implementation for iOS and Android."

[features]
# Hooks for tests and fuzz targets only (`testing.rs`): the test hubs' keys, saved states in memory, clock skew.
test-support = []

[dependencies]
yo-wire = { path = "../wire" }
tls_codec = { workspace = true }
sha2 = { workspace = true }
hkdf = "=0.13.0"
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
libsignal-protocol = { workspace = true }
libsignal-account-keys = { workspace = true }
zkgroup = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

# The state shared by an app and its extensions (statedb.rs). The iPhone links its own SQLite (libsqlite3 of the
# SDK: Apple's file protection, no C compiler for the core); elsewhere SQLite is built in.
[dev-dependencies]
curve25519-dalek = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = { version = "=0.43.0", features = ["fallible_uint"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { workspace = true }
