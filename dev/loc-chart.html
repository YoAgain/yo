<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:900px;background:#0d1117;color:#e6edf3;font:14px -apple-system,"Segoe UI",system-ui,sans-serif;padding:28px 32px}
h3{font-weight:600;font-size:15px;color:#8b949e;margin-bottom:14px}
section{margin-bottom:30px}
svg text{fill:#8b949e;font:12px -apple-system,system-ui,sans-serif}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:12px}
.leg{position:relative;height:22px;font-size:14px;color:#8b949e}.leg span{position:absolute;white-space:nowrap;transform:translateX(-50%)}.leg b{color:#e6edf3;font-weight:600;margin-left:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
</style></head><body>
<section><h3>Lines of code per day, without tests</h3><svg id="line" width="836" height="180"></svg></section>
<section style="margin-bottom:0"><h3 id="h"></h3><div class="bar" id="bar"></div><div class="leg" id="leg"></div></section>
<script>
const D=DATA,k=n=>Math.round(n/1000)+'k';
const W=836,H=180,L=26,R=44,T=28,B=26,peak=Math.max(...D.days);
const x=i=>L+i*(W-L-R)/(D.days.length-1), y=v=>T+(1-v/peak)*(H-T-B);
let s=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#30363d"/>`;
s+=`<polyline points="${D.days.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#9b59b6" stroke-width="3" stroke-linejoin="round"/>`;
const last=D.days.length-1;
D.days.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#9b59b6"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">Day ${i+1}</text>`;
 if(i==0||i==last)s+=`<text x="${x(i)}" y="${y(v)-10}" text-anchor="middle" style="fill:#e6edf3;font-weight:600;font-size:14px">${k(v)}</text>`});
document.getElementById('line').innerHTML=s;
const C={Core:'#9b59b6',iOS:'#e67e22',Android:'#2ecc71',Server:'#3498db',CLI:'#f1c40f',Tests:'#59636e'};
const t=D.parts.reduce((a,[,v])=>a+v,0);
document.getElementById('h').textContent=`Today · ${k(t)}`;
document.getElementById('bar').innerHTML=D.parts.map(([n,v])=>`<i style="flex:${v};background:${C[n]}"></i>`).join('');
const leg=document.getElementById('leg'),BW=836,G=14;let at=0;
// One row of labels, each as close to the middle of its part as the others allow: overlapping neighbours push
// each other apart by half the overlap until none touch, and the row is kept inside the bar.
const P=D.parts.map(([n,v])=>{const e=document.createElement('span');
 e.innerHTML=`<i class="dot" style="background:${C[n]}"></i>${n}<b>${k(v)}</b>`;leg.appendChild(e);
 const mid=(at+v/2)/t*BW;at+=v;return{e,w:e.offsetWidth,c:mid}});
for(let pass=0;pass<200;pass++){let moved=false;
 for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],o=(a.c+a.w/2+G)-(b.c-b.w/2);if(o>0.1){a.c-=o/2;b.c+=o/2;moved=true}}
 P[0].c=Math.max(P[0].c,P[0].w/2);const z=P[P.length-1];z.c=Math.min(z.c,BW-z.w/2);
 for(let i=1;i<P.length;i++)P[i].c=Math.max(P[i].c,P[i-1].c+P[i-1].w/2+G+P[i].w/2);
 for(let i=P.length-2;i>=0;i--)P[i].c=Math.min(P[i].c,P[i+1].c-P[i+1].w/2-G-P[i].w/2);
 if(!moved)break}
P.forEach(x=>x.e.style.left=x.c+'px');
</script></body></html>
