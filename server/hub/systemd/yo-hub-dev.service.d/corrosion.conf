# Falkenstein's dev hub on Corrosion (yo #15): its messages there, its read tables mirrored there for the edges.
[Unit]
After=yo-corrosion.service
Wants=yo-corrosion.service
[Service]
Environment=YO_CORROSION_API=http://127.0.0.1:8097 YO_CORROSION_DB=/var/lib/yo-corrosion/corrosion.db
Environment=YO_HUB_NAME=falkenstein YO_HUB_INDEX=0
SupplementaryGroups=yo-corro
ReadWritePaths=/var/lib/yo-corrosion
