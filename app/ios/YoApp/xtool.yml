version: 1
# xtool prefixes it with XTL-<team> for its development builds.
bundleID: app.justyo.ios
product: YoApp
# Display name, the font (UIAppFonts), export compliance.
infoPath: Info.plist
# The original icon of YoApp/yo-ios was a plain purple square; this one follows the brand guide's logo instead:
# a white "Yo" in Montserrat Bold on Amethyst #9B59B6 (yo-lore/press-kit), 1024 px and opaque, centred by its
# ink (not the font's metrics), its box a hair above the middle (3 px), where it looks centred.
iconPath: AppIcon.png
# At the bundle's root: the font (Info.plist UIAppFonts) and the original Yo sound (a notification sound must be
# in the main bundle; .caf, from yo-ios's yo.mp3).
resources:
  - Resources/Montserrat-Bold.ttf
  - Resources/yo.caf
  # The BIP-39 English word list, for the recovery code (spec 7).
  - Resources/bip39-english.txt
  # The app icons to choose from in Appearance (Info.plist CFBundleAlternateIcons; loose PNGs at the root, 60 pt):
  # the negative (purple Yo on white) and the original Yo's plain purple square; IconStandard only shows the default.
  - Resources/IconNegative@2x.png
  - Resources/IconNegative@3x.png
  - Resources/IconOriginal@2x.png
  - Resources/IconOriginal@3x.png
  - Resources/IconStandard@3x.png
# "Yo" in the share sheet (Sources/YoShare, YoShare-Info.plist): photos and videos sent to a friend from there; and the
# notification service (Sources/YoNotify, YoNotify-Info.plist): "Yo from YoGPT" on a push. Both use the app's state in
# the App Group group.app.justyo.ios (SharedState.swift). App Store and TestFlight only: dev/push.sh drops them from
# Yo Dev.
extensions:
  - product: YoShare
    bundleID: app.justyo.ios.share
    infoPath: YoShare-Info.plist
    resources:
      - Resources/Montserrat-Bold.ttf
  - product: YoNotify
    bundleID: app.justyo.ios.notify
    infoPath: YoNotify-Info.plist
