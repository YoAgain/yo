[package]
name = "yo-wire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The contract between the apps and the hub (spec/v1.md): formats, limits, error codes, the device certificate and the signed request. Verifies, never signs: no secret key, no I/O."

[dependencies]
