[package]
name = "yo-tests"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Scenario, chaos and load tests: a real hub and real clients over HTTP."

[[bin]]
name = "yo-load"
path = "src/load.rs"

[[bin]]
name = "yo-register"
path = "src/register.rs"

[[bin]]
name = "yo-chaos"
path = "src/chaos.rs"

[dependencies]
yo-wire = { path = "../core/wire" }
yo-core = { path = "../core/mls", features = ["testing"] }
yo-hub = { path = "../hub" }
yo-bindings = { path = "../core/bindings" }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
libc = "=0.2.191"
