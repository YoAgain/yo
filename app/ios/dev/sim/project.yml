# The Simulator build of Yo Dev (dev/sim.sh, on a Mac): XcodeGen makes YoSim.xcodeproj (ignored) from this.
# The app's own sources and resources, its notification service (YoNotify), share extension (YoShare), controls and
# widgets (YoControls), the core built for the Simulator
# (YO_CORE_TARGET=aarch64-apple-ios-sim dev/core.sh), and YoDriver: a UI test that drives the app by commands from a
# folder (drive.py).
name: YoSim
options:
  deploymentTarget: {iOS: "26.0"}
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: iphonesimulator
    ARCHS: arm64
targets:
  YoCore:
    type: library.static
    platform: iOS
    sources: [../../YoApp/build/core/swift]
    dependencies:
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
  YoApp:
    type: application
    platform: iOS
    sources:
      - ../../YoApp/Sources/YoApp
      - {path: ../../YoApp/Resources/AppIcon.icon, buildPhase: resources}
      - {path: ../../YoApp/Resources/Negative.icon, buildPhase: resources}
      - {path: ../../YoApp/Resources/Original.icon, buildPhase: resources}
      - {path: ../../YoApp/Resources/Montserrat-Bold.ttf, buildPhase: resources}
      - {path: ../../YoApp/Resources/yo.caf, buildPhase: resources}
      - {path: ../../YoApp/Resources/Licenses.txt, buildPhase: resources}  # dev/licenses.sh, before the build
      - {path: ../../YoApp/Resources/IconLilac2015@2x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconLilac2015@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconOG2014@2x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconOG2014@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconNegative@2x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconNegative@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconOriginal@2x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconOriginal@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IconStandard@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IntroTap@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IntroYoBack@3x.png, buildPhase: resources}
      - {path: ../../YoApp/Resources/IntroAdd@3x.png, buildPhase: resources}
    dependencies:
      - target: YoCore
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
      - target: YoNotify
      - target: YoShare
      - target: YoControls
      - sdk: libsqlite3.tbd  # the core's state (StateDb), as Package.swift links it for YoCore
    settings:
      base:
        # Yo Dev: the dev hub (Hub.isDevApp), with its notification service and Yo Dev's App Group (the Simulator
        # needs no profile for it): "Yo from …" on a push (simctl push, or APNs' sandbox).
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.dev
        PRODUCT_NAME: YoApp
        # The generated Info.plist drops Info.plist's versions without these (About showed "?").
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ../../YoApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Negative Original
        CODE_SIGN_ENTITLEMENTS: YoApp.entitlements
  YoNotify:
    type: app-extension
    platform: iOS
    sources: [../../YoApp/Sources/Extensions/YoNotify]
    dependencies:
      - target: YoCore
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
      - sdk: libsqlite3.tbd  # the core's state (StateDb), as Package.swift links it for YoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.dev.notify
        PRODUCT_NAME: YoNotify
        # An extension without versions does not install.
        MARKETING_VERSION: "1.0.0"  # as the app
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ../../YoApp/YoNotify-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: YoNotify.entitlements
  # The share sheet's "Yo" (photos from Photos to a friend) and the controls and widgets, as in xtool.yml.
  YoShare:
    type: app-extension
    platform: iOS
    sources:
      - ../../YoApp/Sources/Extensions/YoShare
      - {path: ../../YoApp/Resources/Montserrat-Bold.ttf, buildPhase: resources}
    dependencies:
      - target: YoCore
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.dev.share
        PRODUCT_NAME: YoShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ../../YoApp/YoShare-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: YoNotify.entitlements  # the same App Group
  YoControls:
    type: app-extension
    platform: iOS
    sources:
      - ../../YoApp/Sources/Extensions/YoControls
      - {path: ../../YoApp/Resources/Montserrat-Bold.ttf, buildPhase: resources}  # the widgets' names (UIAppFonts)
    dependencies:
      - target: YoCore
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
      - sdk: libsqlite3.tbd
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.dev.controls
        PRODUCT_NAME: YoControls
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ../../YoApp/YoControls-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: YoNotify.entitlements
  # YoNotify's code run by hand (YoNotifyProbe/main.swift): the Simulator starts no notification service itself.
  YoNotifyProbe:
    type: application
    platform: iOS
    sources: [YoNotifyProbe, ../../YoApp/Sources/Extensions/YoNotify]
    dependencies:
      - target: YoCore
      - {framework: ../../YoApp/build/core/yoFFI.xcframework, embed: false}
      - sdk: libsqlite3.tbd  # the core's state (StateDb), as Package.swift links it for YoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.dev.probe
        PRODUCT_NAME: YoNotifyProbe
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"  # as the app
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: YoNotify.entitlements
  YoDriver:
    type: bundle.ui-testing
    platform: iOS
    sources: [YoDriver]
    dependencies: [{target: YoApp}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.justyo.ios.driver
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YoApp
schemes:
  YoSim:
    build:
      targets: {YoApp: all, YoNotifyProbe: all, YoDriver: [test]}
    test:
      targets: [YoDriver]
