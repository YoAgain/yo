[package]
name = "yo-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "yo: a Yo account on the command line, JSON when piped, text and a TUI on a terminal."

[[bin]]
name = "yo"
path = "src/main.rs"

[dependencies]
yo-ui = { path = "../core/ui" }
yo-core = { path = "../core" }
yoip = { path = "../../yoip" }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
getrandom = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
ratatui = "=0.30.2"
qrcode = { version = "=0.15.0", default-features = false, features = ["std"] }
# HTTP/3 to the hub (Cloudflare's alt-svc h3), each line its own QUIC endpoint; HTTP/2 when UDP does not get through.
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "=1.5.0"
bytes = "=1.12.2"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
yo-core = { path = "../core", features = ["test-support"] }
yo-tests = { path = "../../tests" }
yo-hub = { path = "../../server/hub" }
