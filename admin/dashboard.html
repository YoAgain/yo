<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16121c">
<title>Yo admin</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body class="dash">

<svg width="0" height="0" aria-hidden="true" class="dial-defs" focusable="false"><defs><path id="dial-path" d="M28 52 a24 24 0 1 1 0 -48 a24 24 0 1 1 0 48" pathLength="100"/></defs></svg>

<main class="ov" id="overview">
<div class="topbar full">
  <span class="live-lane" id="live-lane" aria-hidden="true"></span>
  <button type="button" class="logo small" id="hub-word" title="live or dev hub: click or key 0 to switch">Yo</button>
  <div id="t-system" role="group" aria-label="Live activity and server status">
    <div class="dial-group" role="group" aria-label="Yo">
    <button type="button" class="dial" id="live" aria-label="Yos per minute">
      <span class="dial-face live-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/></svg><b id="live-n">–</b><span class="live-strip" aria-hidden="true"><svg id="live-spark" viewBox="0 0 100 24" preserveAspectRatio="none"></svg></span></span>
      <span>Yos/min</span>
    </button>
    <button type="button" class="dial" id="problem-dial">
      <span class="dial-face live-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/></svg><b id="problem-n">–</b><svg class="mini-trend" id="problem-trend" viewBox="0 0 28 8" aria-hidden="true"></svg></span>
      <span>Problems</span>
    </button>
    </div>
    <div class="dial-group" role="group" aria-label="Server">
    <button type="button" class="dial" id="c-cpu">
      <span class="dial-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/><use class="dial-fill" href="#dial-path"/></svg><b id="cpu-n">–</b></span><span>CPU</span>
    </button>
    <button type="button" class="dial" id="c-mem">
      <span class="dial-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/><use class="dial-fill" href="#dial-path"/></svg><b id="mem-n">–</b></span><span>Mem</span>
    </button>
    <button type="button" class="dial" id="c-disk">
      <span class="dial-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/><use class="dial-fill" href="#dial-path"/></svg><b id="disk-n">–</b></span><span>Disk</span>
    </button>
    <button type="button" class="dial" id="c-net">
      <span class="dial-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/></svg><b id="net-n">–</b></span><span>LAN</span>
    </button>
    <button type="button" class="dial" id="c-svc">
      <span class="dial-face"><svg class="dial-arc" viewBox="0 0 56 56" aria-hidden="true"><use href="#dial-path"/></svg><b id="svc-n">–</b></span><span>Status</span>
    </button>
    </div>
    <select id="st-every" aria-label="How often the status bot reports" hidden>
          <option value="0">On demand</option><option value="15">15 min</option><option value="30">30 min</option>
          <option value="60">60 min</option><option value="120">120 min</option><option value="1440">Daily (09:00 Berlin)</option></select>
  </div>
  <div class="range" id="range" role="group" aria-label="Range of Usage and Attention"><button type="button" data-r="1" title="last 24 hours">1D</button><button type="button" data-r="7" class="on" title="last 7 days">7D</button><button type="button" data-r="30" title="last 30 days">30D</button><button type="button" data-r="0" title="since the start">Total</button></div></div>
    <div class="svcbar" role="group" aria-label="Services" hidden><button type="button" class="chip" id="t-hub" data-card="svc:hub"><span class="dot"></span>Hub</button><button type="button" class="chip" id="t-dev" data-card="svc:dev"><span class="dot"></span>Dev</button><button type="button" class="chip" id="t-tunnel" data-card="svc:tunnel"><span class="dot"></span>Tunnel</button><button type="button" class="chip" id="t-cli" data-card="svc:cli" title="YoGPT and the status bot"><span class="dot"></span>CLI</button></div>
<div id="detail" class="overview-grid full">
  <article class="tile group chartw" id="t-yc">
    <h2 class="gh"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg><span>Sent</span><span class="gnums"><span class="gtoday big">+<b id="yc-t">–</b> <span id="yc-w">in 24 h</span></span><span class="gsum" title="total"><b id="yc-n">–</b> total</span></span></h2>
    <div class="area" id="yc-area"><svg id="yc-svg" aria-hidden="true"></svg></div>
    <svg class="spark cstrip" id="yc-strip" viewBox="0 0 140 28" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="status"><span class="stale" id="stale" hidden>no answer from the server</span><span id="collection-status" role="status">Loading fresh data…</span></div>
  </article>
  <article class="tile group chartw" id="t-uc">
    <h2 class="gh"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>Accounts</span><span class="gnums"><span class="gtoday big">+<b id="uc-t">–</b> <span id="uc-w">in 24 h</span></span><span class="gsum" title="total"><b id="uc-n">–</b> total</span></span></h2>
    <div class="area" id="uc-area"><svg id="uc-svg" aria-hidden="true"></svg></div>
    <svg class="spark cstrip" id="uc-strip" viewBox="0 0 140 28" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="attestation" hidden></div>
  </article>
  <div id="grp-vr"></div>
  <article class="dcard" aria-label="Problems" id="grp-pr"></article>
  <article class="dcard" aria-label="Accounts stats" id="uc-rows"></article>
  <article class="dcard" aria-label="Delivery" id="delivery-rows"></article>
  <div hidden>
        <div class="crow fold bars sep" id="c-sc"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span class="cl">Secured</span><b class="cn" id="sc-n">–</b><span class="sv" id="sc-sv"></span><svg class="spark" id="sc-spark" viewBox="0 0 140 28" preserveAspectRatio="none" hidden></svg><span class="stack share" id="sc-bar"><span></span></span></div>
        <div class="crow fold bars" id="c-pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span class="cl">Platforms</span><b class="cn" id="pl-n">–</b><span class="stack plats" id="pl-bar"></span></div>
        <div class="crow fold bars go" id="c-ps"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="cl">Push</span><svg class="spark" id="ps-spark" viewBox="0 0 140 28" preserveAspectRatio="none"></svg></div>
        <div class="crow fold bars" id="c-md"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span class="cl">Media</span><b class="cn" id="md-n">–</b><span class="sv" id="md-sv"></span><svg class="spark" id="md-spark" viewBox="0 0 140 28" preserveAspectRatio="none"></svg></div>
        <div class="crow fold bars" id="c-gr"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/></svg><span class="cl">Groups</span><b class="cn" id="gr-n">–</b><span class="sv" id="gr-sv"></span><svg class="spark" id="gr-spark" viewBox="0 0 140 28" preserveAspectRatio="none"></svg></div>
        <div class="crow fold kv" id="c-q" hidden data-card="q"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="cl">Queue</span><b class="cn" id="q-n">–</b></div>
        <div class="crow fold bars go" id="c-dl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h11"/><path d="m10 7.5 4.5 4.5-4.5 4.5"/><path d="M18 5v14"/></svg><span class="cl">Speed</span><svg class="spark" id="dl-spark" viewBox="0 0 140 28" preserveAspectRatio="none"></svg></div>
        <div class="crow fold bars go" id="c-he" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="7" rx="1.5"/><rect x="3.5" y="13" width="17" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span class="cl">Hub errors</span><svg class="spark" id="he-spark" viewBox="0 0 140 28" preserveAspectRatio="none"></svg></div>
  </div>

</div>
  <article class="tile full" id="t-db" aria-label="Database">
    <div class="tables" id="tables"></div>
    <div class="dbfoot"><span id="tables-note">–</span><button type="button" class="eye" id="db-blur" title="blur names and ids (for a screenshot); again to show them" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </article>
  <!-- Shown inside the Database widget: the support chat (support_messages, Chat view) and the users table (users). -->
  <div id="chat-home" hidden><section class="card" id="all-users">
        <div class="scroll ugrid">
          <table class="list sortable" id="all-users-table">
            <thead><tr><th data-sort="name">Name</th><th data-sort="platform" class="group" title="Platform" aria-label="Platform"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.500" y="2.500" width="11" height="19" rx="2.500"/><path d="M11 18.500h2"/></svg></th><th data-sort="app" title="Release: &quot;newest&quot; or the age of the build, coloured as in the App card (newest green to oldest still taken yellow, refused red); the build in the hover" aria-label="Release"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V3h9l9 9-9 9z"/><path d="M7.500 7.500v.1"/></svg></th><th data-sort="secured" class="group" title="Secured: a backup exists" aria-label="Secured"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></th><th data-sort="attested" title="Attested: a real app on a real device, measured, never enforced; green attested, grey failed" aria-label="Attested"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.500c0 4.200 3 7.800 7 9.500 4-1.700 7-5.300 7-9.500V6z"/><path d="m9 12 2 2 4-4"/></svg></th><th data-sort="push" title="Push: notifications on or off" aria-label="Push"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.500 2h-15z"/><path d="M10 21h4"/></svg></th><th data-sort="queued" class="num group" title="Waiting: messages waiting for this user's devices" aria-label="Waiting"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10"/><path d="M8 3v4l4 5 4-5V3M8 21v-4l4-5 4 5v4"/></svg></th><th data-sort="requests_24h" class="num" title="Requests 24h: signed requests (to strangers, not contacts) this user sent in the last 24 hours" aria-label="Requests 24h"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4z"/></svg></th><th data-sort="created" class="group">Signed up</th><th data-sort="last_seen">Last seen</th></tr></thead>
            <tbody id="all-users-body"></tbody>
          </table>
        </div>
      </section><section class="people card" id="people">
        <aside class="plist">
          <div class="plist-head">
            <div class="seg" role="group" aria-label="Show"><button type="button" data-filter="open" class="on" title="something of theirs not handled yet">Open</button><button type="button" data-filter="answered" title="everything of theirs handled">Answered</button></div>
          </div>
          <nav id="person-list" aria-label="Conversations"></nav>
        </aside>
        <section class="pane" id="pane">
          <div class="facts" id="p-facts"></div>
          <details class="extra" id="p-extra"><summary id="p-extra-sum">Reports by this install</summary>
            <div class="extra-grid one"><div><h4>Reported</h4><div id="p-reports"></div></div></div>
          </details>
          <div id="support-history" class="bubbles" aria-live="polite"></div>
          <form id="support-reply" class="composer" hidden>
            <textarea id="support-text" rows="1" required maxlength="2000" aria-label="Reply" placeholder="Write a reply…"></textarea>
            <button type="submit" class="send" aria-label="Send" title="Send (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/></svg></button>
          </form>
          <small id="support-error" role="alert"></small>
        </section>
      </section></div>
</main>

<footer class="foot"><span id="host"></span><span id="foot-hub"></span> · <form method="post" action="/logout"><button type="submit" class="footlink">sign out</button></form></footer>
<script src="/app.js"></script>
</body>
</html>
