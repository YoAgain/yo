# Installed by yo-hub's deploy beside the server's own drop-ins (#12): the port comes from yo-hub-dev.socket, which
# stays up while the service restarts. The dev hub runs a binary of its own, so `deploy --dev` can go ahead of live.
[Unit]
Requires=yo-hub-dev.socket
After=yo-hub-dev.socket

[Service]
ExecStart=
ExecStart=/opt/yo/yo-hub-dev
TimeoutStopSec=30
