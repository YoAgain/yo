name: Android
on:
  pull_request:
    paths: ['app/android/**', 'app/core/**', 'yoip/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/android.yml']
  push:
    branches: ['**']  # not tags: a release runs once, by its release event
    paths: ['app/android/**', 'app/core/**', 'yoip/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/android.yml']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # every commit on main keeps its own result
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Host dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install pinned Android toolchain
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          export PATH="$HOME/.cargo/bin:$PATH"
          nice -n 10 app/android/dev/bootstrap.sh
      # The Rust core (libyo.so for arm64-v8a and x86_64, the host libyo.so for the unit tests, the UniFFI Kotlin) is
      # built once per run, before Gradle, and only when it changed: its outputs are kept under a hash of everything
      # they are made from, the cargo registry and target dir in case they have to be rebuilt. Gradle then skips
      # buildCore (-PyoCorePrebuilt); without that property, as F-Droid builds, Gradle builds the core itself.
      - id: core
        uses: actions/cache/restore@v6
        with:
          path: |
            app/android/app/build/rustJniLibs
            app/android/app/build/generated/yo
            target/android/debug/libyo.so
          key: core-android-${{ hashFiles('app/core/**', 'yoip/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'app/android/dev/core.sh', 'app/android/dev/uniffi.toml', 'app/android/dev/fix-bindings.py') }}
      - id: cargo
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: cargo-android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('app/core/**', 'yoip/**') }}
          restore-keys: cargo-android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Rust core
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export JAVA_HOME="$HOME/Android/jdk" ANDROID_HOME="$HOME/Android/sdk" ANDROID_SDK_ROOT="$HOME/Android/sdk"
          nice -n 10 app/android/dev/core.sh
      - if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            app/android/app/build/rustJniLibs
            app/android/app/build/generated/yo
            target/android/debug/libyo.so
          key: ${{ steps.core.outputs.cache-primary-key }}
      - if: steps.core.outputs.cache-hit != 'true' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      # Two flavors (README.md, Android): play, the Google Play build, and floss, the F-Droid build (unsigned here:
      # F-Droid signs its own build; a release signs a copy with Yo's own floss key for direct installs). The release tag is the version: v1.0.0-RC makes versionName 1.0.0-RC; other builds keep app/android/version.properties'.
      - name: Build, unit tests and lint
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=()
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::release tag '$TAG' is not v<x.y.z> or v<x.y.z>-<suffix> (v1.0.0, v1.0.0-RC)"; exit 1; }
            version=("-PyoVersionName=${TAG#v}")
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          export JAVA_HOME="$HOME/Android/jdk" ANDROID_HOME="$HOME/Android/sdk" ANDROID_SDK_ROOT="$HOME/Android/sdk"
          . app/android/dev/env.sh
          export YO_BUILD=$(date -u +%Y%m%d%H%M)  # the Yo-App build: the UTC minute, as iOS and the CLI
          cd app/android
          nice -n 10 ./gradlew --max-workers=4 assemblePlayDebug assemblePlayRelease assembleFlossDebug assembleFlossRelease \
            testPlayDebugUnitTest testFlossDebugUnitTest lint -PyoCorePrebuilt "${version[@]}" \
            "-PyoVersionCode=$(( $(date +%s) / 60 ))"  # rising, as play.yml: a directly installed floss APK updates
      # F-Droid takes no Google or other proprietary library: the floss runtime classpath must have none.
      - name: floss has no Google dependency
        run: |
          export JAVA_HOME="$HOME/Android/jdk" ANDROID_HOME="$HOME/Android/sdk" ANDROID_SDK_ROOT="$HOME/Android/sdk"
          cd app/android
          ./gradlew --max-workers=4 -q :app:dependencies --configuration flossReleaseRuntimeClasspath > "$RUNNER_TEMP/floss-deps.txt"
          if grep -iE 'com\.google\.(firebase|android\.gms|android\.play|android\.libraries)|googleid' "$RUNNER_TEMP/floss-deps.txt"; then
            echo "::error::the floss build pulls in a Google library"; exit 1
          fi
      # Signed with the floss release key (never the Play upload key) for a direct install; F-Droid's own build is
      # signed by F-Droid with its key, so the two do not update each other.
      - name: floss APK for the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          FLOSS_KEYSTORE_B64: ${{ secrets.FLOSS_KEYSTORE_B64 }}
          FLOSS_KEYSTORE_PASSWORD: ${{ secrets.FLOSS_KEYSTORE_PASSWORD }}
          FLOSS_KEY_ALIAS: ${{ secrets.FLOSS_KEY_ALIAS }}
        run: |
          [ -n "$FLOSS_KEYSTORE_B64" ] || { echo "::error::secret FLOSS_KEYSTORE_B64 is missing"; exit 1; }
          umask 077
          export PATH="$HOME/Android/jdk/bin:$PATH"  # apksigner runs on the pinned JDK
          mkdir -p "$RUNNER_TEMP/floss" "$RUNNER_TEMP/floss-key"
          printf '%s' "$FLOSS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/floss-key/floss.p12"
          apk="$RUNNER_TEMP/floss/yo-floss-$TAG.apk"
          "$HOME/Android/sdk/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/floss-key/floss.p12" \
            --ks-key-alias "$FLOSS_KEY_ALIAS" --ks-pass env:FLOSS_KEYSTORE_PASSWORD --key-pass env:FLOSS_KEYSTORE_PASSWORD \
            --out "$apk" app/android/app/build/outputs/apk/floss/release/app-floss-release-unsigned.apk
          rm -rf "$RUNNER_TEMP/floss-key" "$apk.idsig"
          "$HOME/Android/sdk/build-tools/37.0.0/apksigner" verify "$apk"
          cd "$RUNNER_TEMP/floss" && sha256sum "yo-floss-$TAG.apk" > "yo-floss-$TAG.apk.sha256"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          name: yo-floss
          path: ${{ runner.temp }}/floss/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            app/android/app/build/reports/
            app/android/app/build/outputs/apk/

  # A published release gets the F-Droid (floss) APK, signed with the floss release key, and its checksum.
  release:
    if: github.event_name == 'release'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yo-floss
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
