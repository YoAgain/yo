# Installed by yo-hub's deploy beside the server's own drop-ins (#12): the port comes from yo-hub.socket, which stays
# up while the service restarts, so connections wait in its queue instead of being refused.
[Unit]
Requires=yo-hub.socket
After=yo-hub.socket

[Service]
# The database copied before a deploy's start (/opt/yo/save-db set by deploy), while no hub runs: within the restart,
# so a connection in between cannot start the hub on the copy.
ExecStartPre=+/bin/sh -c 'test -f /opt/yo/save-db || exit 0; rm -f /opt/yo/save-db; c=/var/lib/yo-backup/before-deploy; rm -rf $$c; mkdir -p $$c; for f in yo-hub.sqlite yo-hub.sqlite-wal; do test ! -f /var/lib/yo/$$f || cp -p /var/lib/yo/$$f $$c/; done'
TimeoutStopSec=30
