version: 1
# xtool prefixes it with XTL-<team> for its development builds.
bundleID: app.justyo.ios
product: YoApp
# Display name, the font (UIAppFonts), export compliance.
infoPath: Info.plist
# The original icon of YoApp/yo-ios was a plain purple square; this one follows the brand guide's logo instead:
# a white "Yo" in Montserrat Bold on Amethyst #9B59B6 (yo-lore/press-kit), 1024 px and opaque, centred by its
# ink (not the font's metrics), its box a hair above the middle (3 px), where it looks centred.
iconPath: AppIcon.png
# At the bundle's root: the font (Info.plist UIAppFonts) and the original Yo sound (a notification sound must be
# in the main bundle; .caf, from yo-ios's yo.mp3).
resources:
  - Resources/Montserrat-Bold.ttf
  - Resources/yo.caf
  # Settings › Licenses: the commit of the build and every licence (dev/licenses.sh makes it, ignored).
  - Resources/Licenses.txt
  # Siri and Shortcuts in German (Info.plist CFBundleLocalizations): the App Shortcuts' phrases (YoShortcuts.swift)
  # in German, which Siri reads from the bundle's de.lproj.
  - Resources/de.lproj
  # The app icons to choose from in Appearance (Info.plist CFBundleAlternateIcons; loose PNGs at the root, 60 pt):
  # the negative (purple Yo on white), the icon purple alone (Full Color), OG 2014 (a plain Amethyst square, the App
  # Store icon of 2014) and 2015 (plain Lilac, the App Store icon of 2015 to 2021);
  # IconStandard only shows the default.
  - Resources/IconLilac2015@2x.png
  - Resources/IconLilac2015@3x.png
  - Resources/IconOG2014@2x.png
  - Resources/IconOG2014@3x.png
  - Resources/IconNegative@2x.png
  - Resources/IconNegative@3x.png
  - Resources/IconOriginal@2x.png
  - Resources/IconOriginal@3x.png
  - Resources/IconStandard@3x.png
  # The welcome's pictures of the app (Intro.swift), taken in the Simulator.
  - Resources/IntroTap@3x.png
  - Resources/IntroYoBack@3x.png
  - Resources/IntroAdd@3x.png
  # Each bundle's privacy manifest at its root (Resources/Privacy/<target>): no tracking, the data the hub gets, the
  # required-reason APIs that target's sources use.
  - Resources/Privacy/YoApp/PrivacyInfo.xcprivacy
# "Yo" in the share sheet (Sources/YoShare, YoShare-Info.plist): photos and videos sent to a friend from there; and the
# notification service (Sources/YoNotify, YoNotify-Info.plist): "Yo from YoGPT" on a push. Both use the app's state in
# the App Group group.app.justyo.ios (SharedState.swift). App Store and TestFlight only: dev/push.sh drops them from
# Yo Dev.
extensions:
  - product: YoShare
    bundleID: app.justyo.ios.share
    infoPath: YoShare-Info.plist
    resources:
      - Resources/Montserrat-Bold.ttf
      - Resources/Privacy/YoShare/PrivacyInfo.xcprivacy
  - product: YoNotify
    bundleID: app.justyo.ios.notify
    infoPath: YoNotify-Info.plist
    resources:
      - Resources/Privacy/YoNotify/PrivacyInfo.xcprivacy
  # The controls (Sources/YoControls, YoControls-Info.plist): Send Yo, Yo Back, Yo Camera and Open Yo in Control Center,
  # on the Lock Screen and on the Action button; and the widgets (YoWidgets.swift): the friends' bars on the Home
  # Screen, Yo and Yo Back on the Lock Screen. They read the friends and the state in the App Group too.
  - product: YoControls
    bundleID: app.justyo.ios.controls
    infoPath: YoControls-Info.plist
    resources:
      - Resources/Montserrat-Bold.ttf
      - Resources/Privacy/YoControls/PrivacyInfo.xcprivacy
