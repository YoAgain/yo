[package]
name = "yo-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Yo client core: identities, sessions, delivery. One implementation for iOS and Android."

[features]
# Hooks for tests and fuzz targets only (`testing.rs`): the test hubs' keys, saved states in memory, clock skew.
test-support = []

[dependencies]
yoip = { path = "../../yoip" }
tls_codec = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "=1.13.3"
base64 = { workspace = true }
thiserror = { workspace = true }
libsignal-protocol = { workspace = true }
zkgroup = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
# Oblivious HTTP (spec 4.1): the client side, pure Rust (no NSS), and Binary HTTP.
ohttp = { version = "=0.8.0", default-features = false, features = ["client", "rust-hpke"] }
bhttp = "=0.8.0"
# Linking a device (spec 2.5): HPKE with the suite OHTTP uses (X25519, HKDF-SHA256, AES-128-GCM).
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
httpdate = "=1.0.3"

# The state shared by an app and its extensions (statedb.rs). The iPhone links its own SQLite (libsqlite3 of the
# SDK: Apple's file protection, no C compiler for the core); elsewhere SQLite is built in.
[dev-dependencies]
curve25519-dalek = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = { version = "=0.43.0", features = ["fallible_uint"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { workspace = true }
