[package]
name = "yo-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: built with nightly by dev/fuzz.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
yoip = { path = "../../yoip" }
yo-core = { path = "../../app/core", features = ["test-support"] }
yo-hub = { path = "../../server/hub" }
tls_codec = { version = "=0.5.0", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt"] }
axum = "=0.8.9"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
debug = 1

[[bin]]
name = "wire_envelope"
path = "fuzz_targets/wire_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_content"
path = "fuzz_targets/wire_content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_cert"
path = "fuzz_targets/wire_cert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_api"
path = "fuzz_targets/wire_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_routes"
path = "fuzz_targets/hub_routes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_receive"
path = "fuzz_targets/core_receive.rs"
test = false
doc = false
bench = false
