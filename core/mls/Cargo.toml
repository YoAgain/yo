[package]
name = "yo-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The Yo client core: identities, MLS groups, delivery. One implementation for iOS and Android."

[features]
# Exposes the receive path to the fuzz targets in fuzz/.
fuzz = []

[dependencies]
yo-wire = { path = "../wire" }
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true, features = ["clonable"] }
openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }
tls_codec = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
