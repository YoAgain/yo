name: Update dependencies

# Once a month (and by hand): every third-party dependency to its newest release, pinned exactly, as
# dev/update-deps.sh does (dev/update-deps.py), then built, linted and tested here; a pull request only when something
# changed and everything passed. The iOS app is not built here (no Mac); TestFlight builds it once merged.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: protoc (libsignal builds its protobufs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Toolchain (rust-toolchain.toml) with clippy and rustfmt
        run: rustup show active-toolchain && rustup component add clippy rustfmt
      - name: Newest releases, pinned
        id: deps
        run: |
          changes=$(python3 -I dev/update-deps.py)
          echo "$changes"
          if [ "$changes" = "nothing to update" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          names=$(echo "$changes" | sed -E 's/^[^:]*: ([^ ]+) [^ ]+ -> ([^ ]+).*/\1 \2/' | sort -u | paste -sd, - | sed 's/,/, /g')
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Lock files
        if: steps.deps.outputs.changed == 'true'
        run: cargo update && (cd fuzz && cargo update)
      - name: Lint and test
        if: steps.deps.outputs.changed == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Pull request
        if: steps.deps.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7.0.5
        with:
          branch: deps/monthly
          delete-branch: true
          title: "Dependencies: ${{ steps.deps.outputs.names }}"
          commit-message: |
            Dependencies: ${{ steps.deps.outputs.names }}

            ${{ steps.deps.outputs.summary }}
          body: |
            The newest release of every changed dependency, pinned exactly (dev/update-deps.py). Built, linted and
            tested on Linux in this run; the iOS app is built by TestFlight after the merge.

            ```
            ${{ steps.deps.outputs.summary }}
            ```
